[project]
name = "genlab-backend"
version = "0.1.0"
description = "Backend de la plataforma del laboratorio de genética (GenLab)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "supabase>=2.10",
    "pyjwt>=2.8",
    "httpx>=0.27",
]
 
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]
 
[tool.setuptools.packages.find]
include = ["app*"]
 
[tool.pytest.ini_options]
testpaths = ["tests"]
 
[tool.ruff]
line-length = 100
target-version = "py312"
 
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
 
[tool.ruff.lint.flake8-bugbear]
# Depends(...) como valor por defecto es la forma normal de FastAPI
extend-immutable-calls = ["fastapi.Depends"]