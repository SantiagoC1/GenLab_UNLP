services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genlab}
      POSTGRES_DB: ${POSTGRES_DB:-genlab}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-genlab}:${POSTGRES_PASSWORD:-genlab}@db:5432/${POSTGRES_DB:-genlab}
      CHATBOT_URL: http://chatbot:8001
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  chatbot:
    build: ./chatbot
    env_file:
      - path: .env
        required: false
    ports:
      - '8001:8001'

  frontend:
    build: ./frontend
    env_file:
      - path: .env
        required: false
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
