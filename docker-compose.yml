services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      CHATBOT_URL: http://chatbot:8001
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app

  chatbot:
    build: ./chatbot
    env_file:
      - path: .env
        required: false
    ports:
      - '8001:8001'

  frontend:
    build: ./frontend
    env_file:
      - path: .env
        required: false
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
